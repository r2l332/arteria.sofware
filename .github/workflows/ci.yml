name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Go vulnerability check (govulncheck)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Check third-party module vulnerabilities (hard fail)
          govulncheck -mode=module -show=verbose ./... 2>&1 | tee /tmp/vulncheck.txt || true
          # Fail only if non-stdlib vulnerabilities are found
          if grep -q "Vulnerability" /tmp/vulncheck.txt; then
            # Filter: fail if any vuln is NOT in the standard library
            if grep -A5 "Vulnerability #" /tmp/vulncheck.txt | grep -q "Module:"; then
              echo "❌ Third-party module vulnerabilities found!"
              govulncheck ./...
              exit 1
            fi
            echo "⚠️  Standard library vulns found (requires Go upgrade). Tracked but not blocking."
            echo "   Upgrade Go when v8go supports a newer version."
          else
            echo "✓ No vulnerabilities found"
          fi

      - name: Go dependency audit
        working-directory: backend
        run: |
          go mod verify
          echo "✓ All module checksums verified (no tampering)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (critical + high, production only)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan (critical + high)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Verify Go module checksums
        working-directory: backend
        run: |
          go mod verify
          echo "✓ All module checksums verified"

      - name: Check go.mod is tidy
        working-directory: backend
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak > /dev/null 2>&1 || ! diff -q go.sum go.sum.bak > /dev/null 2>&1; then
            echo "❌ go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            diff go.mod.bak go.mod || true
            exit 1
          fi
          echo "✓ go.mod is tidy"

      - name: Check for replaced/retracted modules
        working-directory: backend
        run: |
          if grep -q "replace" go.mod; then
            echo "⚠️  WARNING: go.mod contains replace directives:"
            grep "replace" go.mod
            echo "Ensure these are intentional."
          fi
          go list -m -json all | python3 -c "
          import sys, json
          retracted = []
          for line in sys.stdin.read().split('}\n{'):
            line = '{' + line.strip('{') + '}'
            try:
              m = json.loads(line)
              if m.get('Retracted'):
                retracted.append(f\"{m['Path']}@{m['Version']}\")
            except: pass
          if retracted:
            print('❌ RETRACTED modules found:')
            for r in retracted: print(f'  {r}')
            sys.exit(1)
          print('✓ No retracted modules')
          "

      - name: Verify lockfile integrity (frontend)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          echo "✓ package-lock.json integrity verified"

  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    needs: [security-scan, supply-chain]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run unit tests
        working-directory: backend
        run: go test ./pkg/... -v -race -count=1

      - name: Build all services
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -o /dev/null ./cmd/ingestion
          CGO_ENABLED=0 go build -o /dev/null ./cmd/tunnel-agent
          CGO_ENABLED=0 go build -o /dev/null ./cmd/tunnel-broker

      - name: Build processing (CGO for v8go)
        working-directory: backend
        run: go build -o /dev/null ./cmd/processing

  frontend-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build --parallel

      - name: Tag images for scanning
        run: |
          # Get compose project name (directory-based)
          PROJECT=$(docker compose config --format json | python3 -c "import sys,json; print(json.load(sys.stdin)['name'])")
          docker tag "${PROJECT}-api" arteria-api:scan
          docker tag "${PROJECT}-frontend" arteria-frontend:scan

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker images for OS vulnerabilities
        run: |
          # Scan only OS packages (not Go binaries — those are covered by govulncheck)
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed \
            --pkg-types os --ignorefile .trivyignore arteria-api:scan

          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed \
            --pkg-types os --ignorefile .trivyignore arteria-frontend:scan

  capillary-binaries:
    name: Cross-compile Capillary
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Build Capillary binaries
        working-directory: backend
        run: |
          VERSION=${GITHUB_SHA::8}
          for platform in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            output="../dist/capillary-${VERSION}-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && output="${output}.exe"
            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w -X main.version=${VERSION}" -o "$output" ./cmd/tunnel-agent
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: capillary-binaries
          path: dist/capillary-*
          retention-days: 30

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Wait for services
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "API ready"
              break
            fi
            sleep 2
          done
          echo "Waiting for processing to connect..."
          sleep 10

      - name: Run integration tests
        run: docker compose --profile test run --rm test-runner all

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50
